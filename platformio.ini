; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
lib_deps = 
	adafruit/Adafruit NeoPixel@^1.12.0
	bblanchon/ArduinoJson@^7.2.0
	tzapu/WiFiManager@^2.0.17
	dawidchyrzynski/home-assistant-integration@^2.1.0

; OTA Upload Configuration
upload_protocol = espota
upload_port = rainbow_lamp.local
; Secure randomly generated password for OTA updates
upload_flags =
   --auth="f7N3sD9kR2wL8pQx"
build_flags =
    -D OTA_PASSWORD=\"f7N3sD9kR2wL8pQx\"
